openapi: 3.0.3
info:
  title: CHRP Mesh Service
  description: 'API for the CHRP off-grid mesh simulator.


    **IMPORTANT**: This is the single source of truth for shared types.

    Do NOT edit the generated Python or TypeScript files.

    Modify only this OpenAPI spec, then regenerate.

    '
  version: 1.3.0
servers:
- url: http://localhost:8000
  description: Local development
paths:
  /ai/ask:
    post:
      operationId: askAi
      summary: Queue a sealed AI question from a connected simulated phone
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiAskRequest'
      responses:
        '200':
          description: Request accepted; progress appears in MeshState.ai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiAskResponse'
        '400':
          description: Unknown or unconnected phone, empty question, or question over 400 UTF-8 bytes
        '422':
          description: Invalid form fields
  /ai/gateway:
    post:
      operationId: setAiGateway
      summary: Select the simulated internet node, or clear it with an empty node_id
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiGatewayRequest'
      responses:
        '200':
          description: Current internet node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiGatewayResponse'
        '404':
          description: Unknown node
  /connect/v1/models:
    get:
      operationId: listAiModels
      summary: List the append-only model catalog and its one-byte indexes
      responses:
        '200':
          description: Model catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AiModel'
  /connect/v1/exchange:
    post:
      operationId: exchangeAiSetupToken
      summary: Exchange a single-use setup token for device credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiSetupRequest'
      responses:
        '200':
          description: Device key and model configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiSetupResponse'
        '400':
          description: Invalid, expired, or already used token
  /connect/v1/relay:
    post:
      operationId: relayAiRequest
      summary: Relay a sealed question and retrieve a sealed answer idempotently
      description: >-
        Authenticate with the gateway device's HMAC-SHA256 signature over the exact
        timestamp header, a dot, and the raw JSON body. The question and answer remain
        sealed with the asker's device key. These paths use the mesh service's /connect
        mount; standalone Water Connect serves the same operations under /v1.
      parameters:
      - $ref: '#/components/parameters/AiDeviceId'
      - $ref: '#/components/parameters/AiTimestamp'
      - $ref: '#/components/parameters/AiSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiRelayRequest'
      responses:
        '200':
          description: Sealed answer or an existing gateway claim to retry later
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiRelayResponse'
        '400':
          description: Malformed relay request
        '401':
          description: Missing, stale, or invalid device signature
        '403':
          description: Gateway is not in the asker's group
        '404':
          description: Unknown asker device
        '409':
          description: Request ID belongs to another device
  /connect/v1/receipt:
    post:
      operationId: recordAiReceipt
      summary: Record delivery of an AI answer
      parameters:
      - $ref: '#/components/parameters/AiDeviceId'
      - $ref: '#/components/parameters/AiTimestamp'
      - $ref: '#/components/parameters/AiSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiReceiptRequest'
      responses:
        '200':
          description: Receipt recorded idempotently
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiReceiptResponse'
        '401':
          description: Missing, stale, or invalid device signature
  /send/text:
    post:
      operationId: sendText
      summary: Send a text message across the mesh
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - src
              - dst
              - text
              properties:
                src:
                  type: string
                  description: Source node ID
                dst:
                  type: string
                  description: Destination node ID
                text:
                  type: string
                  description: Message text
      responses:
        '200':
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTextResponse'
        '400':
          description: Invalid media or nodes
        '413':
          description: Upload exceeds 10 MiB
  /send/image:
    post:
      operationId: sendImage
      summary: Send a compressed image across the mesh
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - src
              - dst
              - file
              properties:
                src:
                  type: string
                dst:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Image accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendImageResponse'
        '400':
          description: Invalid media or nodes
        '413':
          description: Upload exceeds 10 MiB
  /send/voice:
    post:
      operationId: sendVoice
      summary: Send first-five-seconds Codec2 voice across the mesh; verified playback is WAV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - src
              - dst
              - file
              properties:
                src:
                  type: string
                dst:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Voice note accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendVoiceResponse'
        '400':
          description: Invalid media or nodes
        '413':
          description: Upload exceeds 10 MiB
  /nodes:
    get:
      operationId: getNodes
      summary: List all nodes
      responses:
        '200':
          description: Node list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NodeSummary'
  /state:
    get:
      operationId: getState
      summary: Get full mesh state (polling alternative to WebSocket)
      responses:
        '200':
          description: Current mesh state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeshState'
  /send/video:
    post:
      operationId: sendVideo
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                dst:
                  type: string
                file:
                  format: binary
                  type: string
                src:
                  type: string
              required:
              - src
              - dst
              - file
              type: object
        required: true
      responses:
        '200':
          description: Video summary accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendVideoResponse'
        '400':
          description: Invalid media or nodes
        '413':
          description: Upload exceeds 10 MiB
      summary: Send a silent 1 fps video summary (first 5 seconds; <=12 KiB)
  /simulation/config:
    post:
      operationId: configureSimulation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationConfig'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '409':
          description: A transfer is active
        '422':
          description: Invalid configuration
  /simulation/routing:
    post:
      operationId: configureRouting
      summary: Enable or disable distance-aware ETX routing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutingConfig'
      responses:
        '200':
          description: Updated simulation settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '409':
          description: A transfer is active
        '422':
          description: Invalid routing configuration
  /simulation/nodes/{node_id}/position:
    post:
      operationId: moveNode
      summary: Move an idle simulated node in meter coordinates
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodePosition'
      responses:
        '200':
          description: Updated simulation settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Simulation'
        '404':
          description: Unknown node
        '409':
          description: A transfer is active
        '422':
          description: Invalid position or coordinates outside 0 through 10000 meters
  /simulation/reset:
    post:
      operationId: resetSimulation
      summary: Cancel transfers and clear messages/events while preserving node topology and radio/routing settings
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeshState'
  /nodes/{node_id}/status:
    post:
      operationId: setNodeStatus
      parameters:
      - name: node_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - online
              properties:
                online:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  node_id:
                    type: string
                  online:
                    type: boolean
        '404':
          description: Unknown node
  /messages/{msg_id}/content:
    get:
      operationId: getReceivedContent
      parameters:
      - name: msg_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Verified receiver content only; text is decompressed and Codec2 voice is decoded to mono PCM WAV
          content:
            text/plain:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            video/mp4:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '409':
          description: Receiver is incomplete
        '404':
          description: Unknown message
  /demo/{media_type}:
    post:
      operationId: sendDemo
      summary: Send a bundled asset from Alice to Frank
      parameters:
      - name: media_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - voice
          - image
          - video
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendVideoResponse'
        '404':
          description: Unknown asset
components:
  parameters:
    AiDeviceId:
      name: X-Device-Id
      in: header
      required: true
      schema: {type: integer}
    AiTimestamp:
      name: X-Timestamp
      in: header
      required: true
      description: Unix seconds within five minutes of the server clock
      schema: {type: string}
    AiSignature:
      name: X-Signature
      in: header
      required: true
      description: Hex HMAC-SHA256 using the gateway device key
      schema: {type: string}
  schemas:
    AiStage:
      type: string
      enum: [waiting_for_gateway, to_gateway, ai_working, answer_arriving, answered, failed]
    AiOutcome:
      type: string
      enum: [ok, general, blocked, over_budget, no_grounding, error]
    AiStageChange:
      type: object
      required: [stage, at]
      properties:
        stage:
          $ref: '#/components/schemas/AiStage'
        at: {type: number, description: Unix seconds}
    AiState:
      type: object
      required: [internet_node, connected_nodes, requests]
      properties:
        internet_node: {type: string, nullable: true}
        connected_nodes:
          type: array
          items: {type: string}
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AiRequest'
    AiRequest:
      type: object
      required: [request_id, asker, gateway, question, model_index, model, stage, stages, attempts, request_msg_ids, answer_msg_ids, answer, outcome, sources, receipt, error, created_at, note]
      properties:
        request_id: {type: string, format: uuid}
        asker: {type: string}
        gateway: {type: string, nullable: true}
        question: {type: string}
        model_index: {type: integer}
        model: {type: string}
        stage:
          $ref: '#/components/schemas/AiStage'
        stages:
          type: array
          items:
            $ref: '#/components/schemas/AiStageChange'
        attempts: {type: integer}
        request_msg_ids:
          type: array
          items: {type: string}
        answer_msg_ids:
          type: array
          items: {type: string}
        answer: {type: string, nullable: true}
        outcome:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AiOutcome'
        sources:
          type: array
          items: {type: string}
        receipt: {type: boolean}
        error: {type: string}
        created_at: {type: number, description: Unix seconds}
        note: {type: string}
        server_view:
          $ref: '#/components/schemas/AiServerView'
    AiGuardrail:
      type: object
      required: [flagged, patterns, checker]
      properties:
        flagged: {type: boolean}
        patterns: {type: integer}
        checker: {type: string}
    AiSource:
      type: object
      required: [source, excerpt]
      properties:
        source: {type: string}
        excerpt: {type: string}
    AiServerView:
      type: object
      properties:
        model: {type: string, nullable: true}
        kb_via: {type: string, nullable: true}
        guardrail:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AiGuardrail'
        sources:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AiSource'
    AiModel:
      type: object
      required: [index, id, provider, label, price_in, price_out, context_k, tier, privacy, privacy_level]
      properties:
        index: {type: integer, description: Append-only wire catalog index}
        id: {type: string}
        provider: {type: string}
        label: {type: string}
        price_in: {type: number, description: USD per million input tokens}
        price_out: {type: number, description: USD per million output tokens}
        context_k: {type: integer, description: Context window in thousands of tokens}
        tier: {type: string}
        privacy: {type: string}
        privacy_level: {type: string, enum: [ok, unknown, avoid]}
    AiAskRequest:
      type: object
      required: [src, question]
      properties:
        src: {type: string}
        question:
          type: string
          description: Nonempty after whitespace normalization, at most 400 UTF-8 bytes
        model_index:
          type: integer
          description: Defaults to 0; unknown indexes fall back to the default model
    AiAskResponse:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string, format: uuid}
    AiGatewayRequest:
      type: object
      properties:
        node_id: {type: string, description: Empty or omitted clears the gateway}
    AiGatewayResponse:
      type: object
      required: [internet_node]
      properties:
        internet_node: {type: string, nullable: true}
    AiSetupRequest:
      type: object
      required: [token]
      properties:
        token: {type: string}
    AiSetupResponse:
      type: object
      required: [device_id, group_id, device_key, models, default_model]
      properties:
        device_id: {type: integer}
        group_id: {type: integer}
        device_key: {type: string, description: Base64 device key; keep on the phone}
        models:
          type: array
          items:
            $ref: '#/components/schemas/AiModel'
        default_model: {type: integer}
    AiRelayRequest:
      type: object
      required: [request_id, device_id, sealed]
      properties:
        request_id: {type: string, format: uuid}
        device_id: {type: integer, description: Asker device ID}
        sealed: {type: string, description: Base64 sealed model-index byte and UTF-8 question}
    AiRelayMeta:
      type: object
      description: Public diagnostics only; question and answer plaintext are never included
      properties:
        model: {type: string}
        kb_via: {type: string}
        guardrail:
          $ref: '#/components/schemas/AiGuardrail'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AiSource'
        outcome:
          $ref: '#/components/schemas/AiOutcome'
        provider: {type: string}
        verified: {type: boolean}
        verified_grounding: {type: boolean}
        secrets_flagged: {type: boolean}
        full_bytes: {type: integer}
        short_bytes: {type: integer}
        evaluation_id: {type: string, nullable: true}
        note: {type: string}
        gateway_device: {type: integer}
    AiRelayAnswered:
      type: object
      required: [request_id, state, answer, meta]
      properties:
        request_id: {type: string, format: uuid}
        state: {type: string, enum: [answered]}
        answer: {type: string, description: Base64 answer sealed with the asker's device key}
        meta:
          $ref: '#/components/schemas/AiRelayMeta'
    AiRelayClaimed:
      type: object
      required: [request_id, state, by_you, retry_after]
      properties:
        request_id: {type: string, format: uuid}
        state: {type: string, enum: [already_claimed]}
        by_you: {type: boolean}
        retry_after: {type: integer, description: Seconds until the current claim expires}
    AiRelayResponse:
      oneOf:
      - $ref: '#/components/schemas/AiRelayAnswered'
      - $ref: '#/components/schemas/AiRelayClaimed'
    AiReceiptRequest:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string, format: uuid}
    AiReceiptResponse:
      type: object
      required: [request_id, state]
      properties:
        request_id: {type: string, format: uuid}
        state: {type: string, enum: [receipt_recorded]}
    NodeSummary:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
        name:
          type: string
    Node:
      type: object
      required:
      - id
      - name
      - x
      - y
      - color
      properties:
        id:
          type: string
        name:
          type: string
        x:
          type: number
          format: float
        y:
          type: number
          format: float
        color:
          type: string
        online:
          type: boolean
    MessageStatus:
      type: string
      enum:
      - sending
      - in_transit
      - awaiting_receipt
      - delivered
      - failed
      - receipt_unconfirmed
      - cancelled
    Message:
      type: object
      required:
      - msg_id
      - src
      - dst
      - total_chunks
      - received
      - acked
      - status
      - route
      - eta
      - media_type
      - preview
      - progress
      properties:
        msg_id:
          type: string
        src:
          type: string
        dst:
          type: string
        total_chunks:
          type: integer
        received:
          type: integer
        acked:
          type: integer
        status:
          $ref: '#/components/schemas/MessageStatus'
        route:
          type: array
          items:
            type: string
        eta:
          type: number
          format: float
          nullable: true
        media_type:
          type: string
          enum:
          - text
          - image
          - voice
          - video
          - ai_request
          - ai_response
        preview:
          type: string
        progress:
          type: number
          format: float
        created_at:
          type: number
          format: float
        radio_bytes:
          type: integer
        retries:
          type: integer
        lost_packets:
          type: integer
        fec_recovered:
          type: integer
        data_retries:
          type: integer
        control_retries:
          type: integer
        link_retries:
          type: integer
          description: Per-hop retransmissions spent on this message
        frames_sent:
          type: integer
        airtime_seconds:
          type: number
        elapsed_seconds:
          type: number
        efficiency:
          type: number
        received_ids:
          type: array
          items:
            type: integer
        acked_ids:
          type: array
          items:
            type: integer
        missing_ids:
          type: array
          items:
            type: integer
        receiver_status:
          type: string
          enum:
          - waiting
          - partial
          - verified
        metadata:
          $ref: '#/components/schemas/MediaMetadata'
        route_history:
          type: array
          items:
            type: array
            items:
              type: string
        active_link:
          type: array
          items:
            type: string
        route_available:
          type: boolean
        route_proof:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/RouteProof'
        receiver_verified_at:
          type: number
          nullable: true
        content_url:
          type: string
          nullable: true
        error:
          type: string
        eta_basis:
          type: string
    MeshState:
      type: object
      required:
      - nodes
      - connections
      - messages
      properties:
        ai:
          description: AI gateway state; older mesh services omit this field
          nullable: true
          allOf:
          - $ref: '#/components/schemas/AiState'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/Node'
        connections:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        messages:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Message'
        simulation:
          $ref: '#/components/schemas/Simulation'
        events:
          type: array
          items:
            $ref: '#/components/schemas/PacketEvent'
    SendTextResponse:
      type: object
      required:
      - msg_id
      - original
      - compressed
      - chunks
      - metadata
      properties:
        msg_id:
          type: string
        original:
          type: integer
        compressed:
          type: integer
        chunks:
          type: integer
        metadata:
          $ref: '#/components/schemas/MediaMetadata'
    SendImageResponse:
      type: object
      required:
      - msg_id
      - original
      - compressed
      - chunks
      - metadata
      properties:
        msg_id:
          type: string
        original:
          type: integer
        compressed:
          type: integer
        chunks:
          type: integer
        metadata:
          $ref: '#/components/schemas/MediaMetadata'
    SendVoiceResponse:
      type: object
      required:
      - msg_id
      - original
      - compressed
      - chunks
      - metadata
      properties:
        msg_id:
          type: string
        original:
          type: integer
        compressed:
          type: integer
        chunks:
          type: integer
        metadata:
          $ref: '#/components/schemas/MediaMetadata'
    NodePosition:
      type: object
      required:
      - x
      - y
      properties:
        x:
          type: number
          minimum: 0
          maximum: 10000
          description: Horizontal position in meters
        y:
          type: number
          minimum: 0
          maximum: 10000
          description: Vertical position in meters
    RoutingConfig:
      type: object
      required:
      - distance_routing
      properties:
        distance_routing:
          type: boolean
    LinkMetric:
      type: object
      required:
      - source
      - destination
      - distance
      - loss
      - etx
      properties:
        source:
          type: string
        destination:
          type: string
        distance:
          type: number
        loss:
          type: number
        etx:
          type: number
    RouteAlternative:
      type: object
      required:
      - path
      - hops
      - cost
      - distance
      - extra_cost
      properties:
        path:
          type: array
          items:
            type: string
        hops:
          type: integer
        cost:
          type: number
        distance:
          type: number
        extra_cost:
          type: number
    RouteProof:
      type: object
      required:
      - metric
      - chosen
      - chosen_cost
      - chosen_distance
