<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CHRP Mesh</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:18px}.iphone{width:min(390px,100%);height:844px;background:#1c1c1e;border-radius:48px;border:8px solid #333;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:160px;height:32px;background:#000;border-bottom-left-radius:16px;border-bottom-right-radius:16px;z-index:10}.status-bar{height:48px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 24px 8px;font-size:14px;font-weight:600}.app{height:calc(100% - 48px);display:flex;flex-direction:column}.map-container{flex:1.05;min-height:195px;background:#111;position:relative;overflow:hidden}#map{width:100%;height:100%;display:block}.radio-note{position:absolute;left:12px;right:12px;bottom:10px;text-align:center;color:#e5e5ea;font-size:11px;text-shadow:0 1px 3px #000}.chat-area{flex:1.25;background:#1c1c1e;border-top:1px solid #333;display:flex;flex-direction:column;overflow:hidden}.messages{flex:1;overflow-y:auto;padding:12px}.msg-card{background:#2c2c2e;border-radius:16px;padding:12px;margin-bottom:10px;font-size:14px}.msg-header{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:12px;color:#8e8e93}.msg-header span:last-child{text-align:right}.progress-bar{height:4px;background:#3a3a3c;border-radius:2px;margin:8px 0;overflow:hidden}.progress-fill{height:100%;background:#007AFF;width:0;transition:width .3s}.status-delivered{color:#34C759}.status-transit{color:#FF9500}.status-sending{color:#8e8e93}.status-failed{color:#FF453A}.honest-badge{font-size:10px;background:#FF3B30;color:#fff;padding:2px 5px;border-radius:4px;margin-left:4px;white-space:nowrap}.message-meta{font-size:11px;color:#8e8e93;line-height:1.5}.quality-note{color:#ffd60a;font-size:11px;margin-top:6px}.chunks{display:flex;flex-wrap:wrap;gap:3px;margin-top:8px}.chunks i{width:6px;height:6px;border-radius:2px;background:#48484a}.chunks i.received{background:#34C759}.chunks i.acked{background:#0a84ff}.media img,.media video{display:block;max-width:100%;max-height:145px;margin-top:9px;border-radius:9px}.media audio{width:100%;margin-top:9px}details{margin-top:8px;color:#aeaeb2;font-size:11px}summary{cursor:pointer}dl{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:6px}dd{margin:0;text-align:right}.controls{padding:12px;background:#1c1c1e;border-top:1px solid #333}select,input,button,textarea{width:100%;margin-bottom:8px;padding:10px;border-radius:10px;border:none;background:#2c2c2e;color:#fff;font-size:15px}button{background:#007AFF;font-weight:600;cursor:pointer}button:active{opacity:.7}button.secondary{background:#3a3a3c;font-size:12px}button:disabled{opacity:.55}.row{display:flex;gap:8px}.row>*{flex:1}.row button{min-width:0}#notice{min-height:15px;font-size:11px;color:#ffd60a;text-align:center;margin-top:-2px}@media(max-height:780px){.iphone{height:calc(100vh - 20px);border-radius:32px}.map-container{min-height:150px}.controls{padding:9px}.controls textarea{min-height:40px}.messages{padding:9px}}
</style>
</head>
<body>
<div class="iphone"><div class="notch"></div><div class="status-bar"><span>9:41</span><span>CHRP Mesh</span><span>100%</span></div><div class="app">
<div class="map-container"><canvas id="map"></canvas><div id="radio-note" class="radio-note">Connecting mesh…</div></div>
<div class="chat-area"><div class="messages" id="messages"></div><div class="controls">
<div class="row"><select id="src"><option>Loading...</option></select><select id="dst"><option>Loading...</option></select></div>
<textarea id="text" rows="2" placeholder="Type a message..."></textarea>
<div class="row"><input type="file" id="image" accept="image/*" hidden><button data-upload="image">📷 Image</button><input type="file" id="voice" accept="audio/*" hidden><button data-upload="voice">🎤 Voice</button><input type="file" id="video" accept="video/*" hidden><button data-upload="video">🎞 Video</button></div>
<div class="row"><button id="send-text">Send Text</button><button id="record" class="secondary">Record 5s</button></div>
<div class="row"><button id="demo-voice" class="secondary">Demo voice</button><button id="demo-image" class="secondary">Demo image</button><button id="demo-video" class="secondary">Demo video</button></div><div id="notice" role="status" aria-live="polite"></div>
</div></div></div></div>
<script>
const canvas=document.getElementById('map'),ctx=canvas.getContext('2d'),messagesEl=document.getElementById('messages');let state=null,nodes=[],connections={},messages={},initialized=false;const $=id=>document.getElementById(id),prettyBytes=n=>n>=1024?(n/1024).toFixed(1)+' KiB':n+' B',name=id=>nodes.find(n=>n.id===id)?.name||id;
function notice(text){$('notice').textContent=text||''}function resize(){canvas.width=canvas.parentElement.clientWidth;canvas.height=canvas.parentElement.clientHeight;draw()}window.addEventListener('resize',resize);setTimeout(resize,100);
function draw(){if(!canvas.width)return;ctx.clearRect(0,0,canvas.width,canvas.height);const s=Math.min(canvas.width/600,canvas.height/400),ox=(canvas.width-600*s)/2,oy=(canvas.height-400*s)/2;ctx.strokeStyle='#3a3a3c';ctx.lineWidth=2;for(const[a,ns]of Object.entries(connections)){const na=nodes.find(n=>n.id===a);if(!na)continue;for(const b of ns){if(a>b)continue;const nb=nodes.find(n=>n.id===b);if(!nb)continue;ctx.beginPath();ctx.moveTo(ox+na.x*s,oy+na.y*s);ctx.lineTo(ox+nb.x*s,oy+nb.y*s);ctx.stroke()}}Object.values(messages).forEach(m=>{if(m.route?.length>1){ctx.strokeStyle=m.status==='delivered'?'#34C759':'#007AFF';ctx.lineWidth=3;ctx.setLineDash([4,4]);for(let i=0;i<m.route.length-1;i++){const a=nodes.find(n=>n.id===m.route[i]),b=nodes.find(n=>n.id===m.route[i+1]);if(a&&b){ctx.beginPath();ctx.moveTo(ox+a.x*s,oy+a.y*s);ctx.lineTo(ox+b.x*s,oy+b.y*s);ctx.stroke()}}ctx.setLineDash([])}});nodes.forEach(n=>{ctx.beginPath();ctx.arc(ox+n.x*s,oy+n.y*s,14,0,Math.PI*2);ctx.fillStyle=n.online?n.color:'#48484a';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold 11px -apple-system';ctx.textAlign='center';ctx.fillText(n.name,ox+n.x*s,oy+n.y*s+28)})}
function statusInfo(m){if(m.status==='delivered')return['DELIVERED','status-delivered',''];if(m.status==='failed')return['FAILED','status-failed','NOT DELIVERED'];if(m.status==='receipt_unconfirmed')return['RECEIPT UNCONFIRMED','status-failed','NOT DELIVERED'];return[m.status.replaceAll('_',' ').toUpperCase(),'status-transit','NOT DELIVERED']}
function appendMedia(card,m){if(!m.content_url||card.querySelector('.media').childNodes.length)return;const media=card.querySelector('.media'),label=document.createElement('div');label.className='message-meta';label.textContent='✓ Verified at receiver';media.append(label);if(['image','voice','video'].includes(m.media_type)){const node=document.createElement(m.media_type==='image'?'img':m.media_type==='voice'?'audio':'video');node.src=m.content_url;if(node.tagName==='IMG')node.alt='Verified received image';else{node.controls=true;node.preload='metadata';if(node.tagName==='VIDEO')node.playsInline=true}media.append(node)}else if(m.media_type==='text'){fetch(m.content_url).then(r=>r.text()).then(value=>{const text=document.createElement('div');text.className='message-meta';text.textContent='Received: '+value;media.append(text)}).catch(()=>{})}}
function updateMessages(){const list=Object.values(messages).sort((a,b)=>b.created_at-a.created_at);if(!list.length){messagesEl.innerHTML='<div style="text-align:center;color:#8e8e93;padding:20px">No messages yet.<br>Send across the mesh.</div>';return}list.forEach(m=>{let card=document.getElementById('m-'+m.msg_id);if(!card){card=document.createElement('div');card.className='msg-card';card.id='m-'+m.msg_id;card.innerHTML='<div class="msg-header"><span class="head-left"></span><span class="head-right"></span></div><div class="summary"></div><div class="progress-bar"><div class="progress-fill"></div></div><div class="message-meta"></div><div class="chunks"></div><div class="quality-note"></div><div class="media"></div><details><summary>Compression & delivery details</summary><dl></dl></details>';messagesEl.append(card)}const[label,cls,badge]=statusInfo(m);card.querySelector('.head-left').textContent=`${name(m.src)} → ${name(m.dst)}`;card.querySelector('.head-right').innerHTML=`<span class="${cls}">${label}</span>${badge?`<span class="honest-badge">${badge}</span>`:''}`;card.querySelector('.summary').textContent=`${m.media_type}: ${m.preview||''}`;card.querySelector('.progress-fill').style.width=Math.round(m.progress*100)+'%';const route=m.route?.length?m.route.map(name).join(' → '):'finding route',eta=m.eta===0?'confirmed':m.eta==null?'unavailable':`~${Math.ceil(m.eta)}s estimated`;card.querySelector('.message-meta').textContent=`Receiver ${m.received}/${m.total_chunks} · confirmed ${m.acked}/${m.total_chunks} · ${route} · ${eta}`;const chunks=card.querySelector('.chunks');chunks.replaceChildren();const received=new Set(m.received_ids||[]),acked=new Set(m.acked_ids||[]);for(let i=0;i<Math.min(m.total_chunks,80);i++){const c=document.createElement('i');c.className=acked.has(i)?'acked':received.has(i)?'received':'';c.title=`Chunk ${i}`;chunks.append(c)}card.querySelector('.quality-note').textContent=m.metadata?.quality_label||'';card.querySelector('dl').innerHTML=`<dt>Original</dt><dd>${prettyBytes(m.metadata?.original_bytes||0)}</dd><dt>Compressed</dt><dd>${prettyBytes(m.metadata?.encoded_bytes||0)}</dd><dt>Radio traffic</dt><dd>${prettyBytes(m.radio_bytes||0)}</dd><dt>Loss / recovery</dt><dd>${m.lost_packets||0} lost · ${m.fec_recovered||0} repaired · ${m.retries||0} retries</dd>`;appendMedia(card,m)})}
function setState(next){state=next;nodes=state.nodes||[];connections=state.connections||{};messages=state.messages||{};if(!initialized&&nodes.length){for(const id of['src','dst'])$(id).innerHTML=nodes.map(n=>`<option value="${n.id}">${n.name}</option>`).join('');$('dst').value='node5';initialized=true}const s=state.simulation;if(s)$('radio-note').textContent=`${(s.bit_rate/1000).toFixed(2)} kbps · ${Math.round(s.loss_rate*100)}% loss · ${s.range_meters}m range · parity ${s.fec?'on':'off'}`;draw();updateMessages()}
let socket;function connect(){socket=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);socket.onmessage=e=>setState(JSON.parse(e.data));socket.onclose=()=>setTimeout(connect,1200)}connect();
async function api(url,options={}){const r=await fetch(url,options);if(!r.ok){const b=await r.json();throw new Error(b.detail||'Request failed')}return r.json()}async function sendText(){const src=$('src').value,dst=$('dst').value,text=$('text').value.trim();if(!text||src===dst)return;const f=new FormData();f.append('src',src);f.append('dst',dst);f.append('text',text);try{await api('/send/text',{method:'POST',body:f});$('text').value='';notice('Text queued.')}catch(e){notice(e.message)}}async function sendFile(type,file){const f=new FormData();f.append('src',$('src').value);f.append('dst',$('dst').value);f.append('file',file);try{notice('Compressing '+type+'…');const r=await api('/send/'+type,{method:'POST',body:f});notice(`${type}: ${prettyBytes(r.original)} → ${prettyBytes(r.compressed)} · ${r.chunks} packets`)}catch(e){notice(e.message)}}$('send-text').onclick=sendText;document.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>$(b.dataset.upload).click());['image','voice','video'].forEach(type=>$(type).onchange=e=>{if(e.target.files[0])sendFile(type,e.target.files[0]);e.target.value=''});for(const type of['voice','image','video'])$('demo-'+type).onclick=async()=>{try{const r=await api('/demo/'+type,{method:'POST'});notice(`Demo ${type}: ${prettyBytes(r.original)} → ${prettyBytes(r.compressed)} · ${r.chunks} packets`)}catch(e){notice(e.message)}};$('record').onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true}),recorder=new MediaRecorder(stream),parts=[];recorder.ondataavailable=e=>parts.push(e.data);recorder.onstop=()=>{stream.getTracks().forEach(t=>t.stop());$('record').disabled=false;$('record').textContent='Record 5s';sendFile('voice',new File(parts,'voice.webm',{type:recorder.mimeType}))};recorder.start();$('record').disabled=true;$('record').textContent='Recording…';notice('Recording for five seconds…');setTimeout(()=>recorder.stop(),5000)}catch(e){notice('Microphone unavailable: '+e.message)}};
</script>
</body>
</html>
